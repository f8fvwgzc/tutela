name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

# Every job blocks the merge. There is no continue-on-error anywhere in this file.
jobs:
  lint:
    name: rust (fmt + clippy + doc)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0 # branch pinned to the toolchain in rust-toolchain.toml
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # v2.9.2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: make fmt-check

      - name: cargo clippy -D warnings
        run: make lint

      - name: cargo doc -D warnings
        run: make doc

  test:
    name: rust test
    runs-on: ubuntu-24.04
    # tutela-store's tests run against a real Postgres. TUTELA_REQUIRE_DATABASE
    # makes a missing database a failure here, never a skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # test value; this database lives only for the job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TUTELA_TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      TUTELA_REQUIRE_DATABASE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0 # branch pinned to the toolchain in rust-toolchain.toml

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # v2.9.2
        with:
          shared-key: test

      - name: cargo test
        run: make test

  supply-chain:
    name: supply chain (cargo-deny + cargo-audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0 # branch pinned to the toolchain in rust-toolchain.toml

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny check
        run: make deny

      - name: cargo audit
        run: make audit

  js:
    name: javascript sdks (make js)
    runs-on: ubuntu-24.04
    # make js-it runs @f8fvwgzc/tutela-js against a real tutelad on a real
    # Postgres, as the Rust database tests do.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # test value; this database lives only for the job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TUTELA_TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres
      TUTELA_REQUIRE_DATABASE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0 # branch pinned to the toolchain in rust-toolchain.toml

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # v2.9.2
        with:
          shared-key: test

      - name: Install pnpm (the version of packageManager in package.json)
        uses: pnpm/action-setup@v6

      - name: Install node 22.12
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: make js
        run: make js
