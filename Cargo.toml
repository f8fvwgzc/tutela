[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/f8fvwgzc/tutela"
authors = ["f8fvwgzc"]
publish = false

[workspace.dependencies]
# internal crates
tutela-contracts = { path = "crates/tutela-contracts" }
tutela-pdp = { path = "crates/tutela-pdp" }
tutela-safenet = { path = "crates/tutela-safenet" }
tutela-store = { path = "crates/tutela-store" }

# Smaller build folders: full debug info makes target/ several times bigger.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
