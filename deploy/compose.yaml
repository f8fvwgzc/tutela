# tutelad on one host. Your Postgres lives elsewhere: a database that is not on
# this machine needs sslmode=require, and the certificate is always verified.
#
#   TUTELA_DATABASE_URL="host=db.example.test user=tutela_service password=... dbname=tutela sslmode=require" \
#   TUTELAD_TAG=<release> docker compose -f deploy/compose.yaml up
#
# TUTELA_DATABASE_URL names a role that owns nothing. Migrations run as the
# owner role, apart from this service (docs/THREAT-MODEL.md TM-14).
#
# The image is not published yet (issue #49).
services:
  tutelad:
    image: ghcr.io/f8fvwgzc/tutelad:${TUTELAD_TAG:?set TUTELAD_TAG to a release}
    env_file:
      - tutelad.env
    environment:
      TUTELA_DATABASE_URL: ${TUTELA_DATABASE_URL:?set TUTELA_DATABASE_URL}
      TUTELA_TRUST_FILE: /etc/tutela/trust.toml
    volumes:
      - ./trust.toml:/etc/tutela/trust.toml:ro
    ports:
      - "8080:8080"
    stop_grace_period: 40s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
