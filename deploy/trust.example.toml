# The tutelad trust file: which issuers it accepts, and for which tenants
# (docs/CONTRACTS.md 1.6), and which audiences it issues tokens for. Copy it to
# trust.toml and edit it. It holds no secret. tutelad's own issuer
# (TUTELA_ISSUER) is not listed here: it is trusted for every tenant of its
# directory.

# Host names the JWKS fetch may reach on a private network.
private_hosts = ["keycloak.internal"]

# A Tutela issuer.
[[issuer]]
iss = "https://auth.example.test"
jwks_uri = "https://auth.example.test/.well-known/jwks.json"
algs = ["ES256"]
tenants = ["ten_0193a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b"]

# An external issuer (docs/CONTRACTS.md 4.6): exactly one tenant, which comes
# from this file and never from the token. Token exchange issues tokens for
# that tenant under tutelad's own issuer, so the tenant must be in tutelad's
# directory under TUTELA_ISSUER (docs/CONTRACTS.md 4.8).
[[issuer]]
iss = "https://keycloak.internal/realms/acme"
jwks_uri = "https://keycloak.internal/realms/acme/protocol/openid-connect/certs"
algs = ["RS256"]
tenants = ["ten_0193a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2c"]
external = true
allow_typ_jwt = true

# An audience token exchange issues tokens for, besides tutelad's own
# (TUTELA_AUDIENCE). delegation_aware: it accepts delegated agent tokens.
[[audience]]
name = "crm-api"
delegation_aware = false

# attache's embassy: JWT-SVIDs that name a workload on
# spiffe://<trust domain>/ns/<namespace>/svc/<service>. Its tokens only ever
# stand for a registered agent acting in a delegated token (ADR-0033).
[[issuer]]
iss = "https://embassy.prod-eu1.attache.example.test"
jwks_uri = "https://embassy.prod-eu1.attache.example.test/keys"
algs = ["ES256"]
tenants = ["ten_0193a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2c"]
external = true
allow_typ_jwt = true
workloads = true

# A service that accepts delegated agent tokens.
[[audience]]
name = "symphony"
delegation_aware = true

