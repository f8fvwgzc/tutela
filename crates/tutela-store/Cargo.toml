[package]
name = "tutela-store"
description = "Tutela's permission tables in Postgres: schema, migrations and the tenant data the evaluator reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "alloc"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-uuid-1"] }
tutela-contracts = { workspace = true }
tutela-pdp = { workspace = true }
tutela-vault = { workspace = true }
uuid = { version = "1.29.0", features = ["v7"] }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "closure"
harness = false
