[package]
name = "tutela-cli"
description = "The tutela CLI: init, check, migrate, apply and approvals for tutela.resources.toml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "tutela"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs"] }
tutela-pdp = { workspace = true }
tutela-safenet = { workspace = true }
tutela-store = { workspace = true }
zeroize = "1.9.1"
