[package]
name = "tutela-safenet"
description = "SSRF-safe outbound HTTP for Tutela: public addresses only, checked at connect time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net"] }
url = "2.5.7"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
