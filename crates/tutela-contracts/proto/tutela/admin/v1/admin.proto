// The admin API over gRPC (CONTRACTS.md 7.13). Each method runs the same
// code as its HTTP route, and answers the same thing: typed messages where
// the answer is small, and the JSON answer of the route as text where it is
// a report (`result_json`). This file grows only by adding fields and
// services (CONTRACTS.md 10).
//
// Which token (ADR-0032, ADR-0040): a person sends an admin token
// (`aud=tutela-admin`, after step-up); a service (`sa`, `key`) sends its
// `tutela-authz` token. Anything else is PERMISSION_DENIED.
syntax = "proto3";

package tutela.admin.v1;

service Admin {
  // ---------- Agent principals and people (CONTRACTS.md 7.13.1) ----------

  // POST /v1/admin/agents: registers a new agent of the caller's tenant.
  rpc RegisterAgent(RegisterAgentRequest) returns (PrincipalState);
  // GET /v1/admin/agents: the tenant's agents, a page at a time.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // POST /v1/admin/principals/state: one principal of the tenant.
  rpc GetPrincipal(PrincipalRequest) returns (PrincipalState);
  // POST /v1/admin/principals/disabled: disables or enables a principal.
  rpc SetDisabled(SetDisabledRequest) returns (PrincipalState);
  // POST /v1/admin/principals/revoke-sessions: raises the epoch.
  rpc RevokeSessions(PrincipalRequest) returns (PrincipalState);

  // ---------- Model versions (CONTRACTS.md 7.9) ----------

  // GET /v1/models.
  rpc ListModelVersions(ListModelVersionsRequest) returns (JsonResult);
  // GET /v1/models/{version}.
  rpc GetModelVersion(GetModelVersionRequest) returns (JsonResult);
  // POST /v1/models/impact.
  rpc ModelImpact(ModelChangeRequest) returns (JsonResult);
  // POST /v1/models/publish.
  rpc PublishModel(ModelChangeRequest) returns (JsonResult);
  // GET /v1/models/settings.
  rpc GetModelSettings(GetModelSettingsRequest) returns (JsonResult);
  // PUT /v1/models/settings.
  rpc PutModelSettings(PutModelSettingsRequest) returns (JsonResult);
  // POST /v1/models/proposals.
  rpc ProposeModel(ModelChangeRequest) returns (JsonResult);
  // GET /v1/models/proposals.
  rpc ListProposals(ListProposalsRequest) returns (JsonResult);
  // GET /v1/models/proposals/{id}.
  rpc GetProposal(ProposalRequest) returns (JsonResult);
  // POST /v1/models/proposals/{id}/approve.
  rpc ApproveProposal(ApproveProposalRequest) returns (JsonResult);
  // POST /v1/models/proposals/{id}/reject.
  rpc RejectProposal(ProposalRequest) returns (JsonResult);
  // POST /v1/admin/resource-types: onto-intelli's import. It merges the
  // types into the active model and stores a proposal; it never publishes.
  rpc PutResourceTypes(PutResourceTypesRequest) returns (JsonResult);

  // ---------- Scopes (CONTRACTS.md 7.13.2) ----------

  // PUT /v1/admin/boundaries: the move and link rules of a registered scope.
  rpc SetBoundary(SetBoundaryRequest) returns (RevResponse);

  // ---------- The tenant, its orgs, its people (CONTRACTS.md 7.13.5) ----------

  // GET /v1/admin/tenant.
  rpc GetTenant(GetTenantRequest) returns (TenantState);
  // PATCH /v1/admin/tenant: its display name.
  rpc UpdateTenant(UpdateTenantRequest) returns (TenantState);
  // DELETE /v1/admin/tenant: a soft delete; the data is purged after the grace.
  rpc DeleteTenant(DeleteTenantRequest) returns (TenantState);
  // GET /v1/admin/orgs.
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  // POST /v1/admin/orgs: a new org; the caller becomes its owner.
  rpc CreateOrg(CreateOrgRequest) returns (OrgState);
  // PATCH /v1/admin/orgs/{org}: its display name.
  rpc UpdateOrg(UpdateOrgRequest) returns (OrgState);
  // DELETE /v1/admin/orgs/{org}: a soft delete.
  rpc DeleteOrg(OrgRequest) returns (OrgState);
  // POST /v1/admin/orgs/{org}/restore: undoes a soft delete before the purge.
  rpc RestoreOrg(OrgRequest) returns (OrgState);
  // POST /v1/admin/users/delete: deletes a person of the tenant.
  rpc DeleteUser(PrincipalRequest) returns (PrincipalState);

  // ---------- Webhooks (CONTRACTS.md 7.13.6) ----------

  // POST /v1/admin/webhooks: the answer holds the secret, the one time it
  // is shown.
  rpc RegisterWebhook(RegisterWebhookRequest) returns (WebhookSecret);
  // GET /v1/admin/webhooks.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  // POST /v1/admin/webhooks/{id}/rotate: a new secret, shown this once.
  rpc RotateWebhookSecret(RotateWebhookSecretRequest) returns (WebhookSecret);
  // POST /v1/admin/webhooks/{id}/disable.
  rpc DisableWebhook(WebhookRequest) returns (Webhook);
  // GET /v1/admin/webhooks/{id}/deliveries.
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
  // POST /v1/admin/webhooks/{id}/deliveries/{seq}/redeliver.
  rpc Redeliver(RedeliverRequest) returns (Delivery);

  // ---------- Scopes, role assignments and groups (CONTRACTS.md 7.13.7) ----------
  //
  // Each answers the JSON of its route as `result_json`. A change is
  // refused with PERMISSION_DENIED `not_held` when it gives anyone more
  // than the caller holds (ADR-0043).

  // GET /v1/admin/scopes?under=: a page of the registered scopes below one.
  rpc ListScopes(ListScopesRequest) returns (JsonResult);
  // POST /v1/admin/scopes: registers a scope under its parent.
  rpc PutScope(PutScopeRequest) returns (JsonResult);
  // POST /v1/admin/scopes/move: moves a scope when write_check allows it.
  rpc MoveScope(MoveScopeRequest) returns (JsonResult);
  // POST /v1/admin/scopes/delete: the scope and every scope below it.
  rpc DeleteScope(ScopeRequest) returns (JsonResult);
  // PUT /v1/admin/scopes/private: the private flag.
  rpc SetPrivate(SetPrivateRequest) returns (JsonResult);
  // POST /v1/admin/assignments/list: a page of role assignments.
  rpc ListAssignments(ListAssignmentsRequest) returns (JsonResult);
  // POST /v1/admin/assignments: gives a role at a scope.
  rpc Assign(AssignRequest) returns (JsonResult);
  // PATCH /v1/admin/assignments/{id}: when it ends.
  rpc SetAssignmentExpiry(SetAssignmentExpiryRequest) returns (JsonResult);
  // DELETE /v1/admin/assignments/{id}.
  rpc Unassign(AssignmentRequest) returns (JsonResult);
  // GET /v1/admin/groups: a page of groups.
  rpc ListGroups(ListGroupsRequest) returns (JsonResult);
  // POST /v1/admin/groups: a new group in an org.
  rpc CreateGroup(CreateGroupRequest) returns (JsonResult);
  // DELETE /v1/admin/groups/{key}.
  rpc DeleteGroup(GroupRequest) returns (JsonResult);
  // GET /v1/admin/groups/{key}/members: a page of direct members.
  rpc ListGroupMembers(ListGroupMembersRequest) returns (JsonResult);
  // POST /v1/admin/groups/{key}/members.
  rpc AddGroupMember(GroupMemberRequest) returns (JsonResult);
  // POST /v1/admin/groups/{key}/members/remove.
  rpc RemoveGroupMember(GroupMemberRequest) returns (JsonResult);
  // GET /v1/admin/roles: the roles and types of the active model.
  rpc ListRoles(ListRolesRequest) returns (JsonResult);

  // ---------- Apps (CONTRACTS.md 7.13.8) ----------
  //
  // Each answers the JSON of its route as `result_json`. The answers of
  // CreateApp and RotateAppSecret hold a client secret, the one time it is
  // shown.

  // POST /v1/admin/apps: a new app, its service account and its secret.
  rpc CreateApp(CreateAppRequest) returns (JsonResult);
  // GET /v1/admin/apps.
  rpc ListApps(ListAppsRequest) returns (JsonResult);
  // POST /v1/admin/apps/{id}/rotate: a new secret; the old ones keep working
  // for the overlap.
  rpc RotateAppSecret(RotateAppSecretRequest) returns (JsonResult);
  // POST /v1/admin/apps/{id}/disable.
  rpc DisableApp(AppRequest) returns (JsonResult);
}


// The JSON answer of the HTTP route, as text.
message JsonResult {
  string result_json = 1;
}

// A new tenant revision.
message RevResponse {
  uint64 rev = 1;
}

message RegisterAgentRequest {
  // The SPIFFE id of the workload the agent runs as, on attache's path
  // `spiffe://<trust domain>/ns/<namespace>/svc/<service>`. Empty: none.
  string workload = 1;
}

message PrincipalRequest {
  // `user:usr_<uuidv7>` or `agent:agt_<uuidv7>`.
  string principal = 1;
}

message SetDisabledRequest {
  string principal = 1;
  bool disabled = 2;
}

message PrincipalState {
  string principal = 1;
  uint64 epoch = 2;
  bool disabled = 3;
  // Empty: no workload.
  string workload = 4;
  // The tenant revision after a change; 0 for a read and for a change that
  // bumps none (registering an agent).
  uint64 rev = 5;
}

message ListAgentsRequest {
  // The `next_after` of the page before. Empty: from the start.
  string after = 1;
  // At most 1000. 0: 100.
  uint32 limit = 2;
  // Only the agent registered for this workload's SPIFFE id. Empty: all.
  string workload = 3;
}

message ListAgentsResponse {
  repeated PrincipalState agents = 1;
  // Empty: no more.
  string next_after = 2;
}

message ListModelVersionsRequest {
  optional int64 before = 1;
  optional uint32 limit = 2;
}

message GetModelVersionRequest {
  int64 version = 1;
}

// The body of a publish, an impact report or a proposal (CONTRACTS.md 7.9).
message ModelChangeRequest {
  optional string source = 1;
  optional int64 restore = 2;
  optional int64 expected_version = 3;
  optional string approval = 4;
}

message GetModelSettingsRequest {}

message PutModelSettingsRequest {
  bool two_person = 1;
}

message ListProposalsRequest {}

message ProposalRequest {
  string id = 1;
}

message ApproveProposalRequest {
  string id = 1;
  optional string approval = 2;
}

message PutResourceTypesRequest {
  // `types` of the JSON body: an object of type name to its definition, in
  // the keys of MANIFEST.md 4, as JSON text.
  string types_json = 1;
  // The active version the caller compared against. Missing: the active
  // one now.
  optional int64 expected_version = 2;
}

message PathEntry {
  string type = 1;
  string id = 2;
}

message SetBoundaryRequest {
  PathEntry scope = 1;
  // `members`, `owners` or `none`. Empty: not set.
  string moves_out = 2;
  string moves_in = 3;
  // `approve` or `block`. Empty: not set.
  string on_looser = 4;
  // `any`, `team` or `none`. Empty: not set.
  string links_from = 5;
}

message GetTenantRequest {}

message UpdateTenantRequest {
  // Empty: no name.
  string name = 1;
}

message DeleteTenantRequest {}

// Times are RFC 3339 text with 3 fractional digits; empty when not set.
message TenantState {
  string tid = 1;
  string iss = 2;
  string name = 3;
  string created_at = 4;
  string purge_after = 5;
}

message ListOrgsRequest {}

message OrgState {
  string org = 1;
  string name = 2;
  string created_at = 3;
  string deleted_at = 4;
  string purge_after = 5;
  string purged_at = 6;
  // The tenant revision after a change that bumped it; else 0.
  uint64 rev = 7;
}

message ListOrgsResponse {
  repeated OrgState orgs = 1;
}

message CreateOrgRequest {
  // Empty: no name.
  string name = 1;
}

message UpdateOrgRequest {
  string org = 1;
  // Empty: no name.
  string name = 2;
}

message OrgRequest {
  string org = 1;
}
message RegisterWebhookRequest {
  string url = 1;
  // Empty: every type.
  repeated string types = 2;
}

message Webhook {
  string id = 1;
  string url = 2;
  repeated string types = 3;
  bool disabled = 4;
  string created_by = 5;
}

message WebhookSecret {
  Webhook webhook = 1;
  // `whsec_<base64>`, shown once.
  string secret = 2;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
}

message RotateWebhookSecretRequest {
  string id = 1;
  // Missing: 3600.
  optional uint64 overlap_secs = 2;
}

message WebhookRequest {
  string id = 1;
}

message ListDeliveriesRequest {
  string id = 1;
  // Only the dead ones.
  bool dead_only = 2;
  uint64 after = 3;
  // 0: 100.
  uint32 limit = 4;
}

message Delivery {
  string webhook = 1;
  uint64 seq = 2;
  string state = 3;
  uint32 attempts = 4;
  // 0: none.
  uint32 last_status = 5;
  string last_error = 6;
}

message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;
  // 0: no more.
  uint64 next_after = 2;
}

message RedeliverRequest {
  string id = 1;
  uint64 seq = 2;
}

// ---------- Scopes, role assignments and groups (CONTRACTS.md 7.13.7) ----------

message ListScopesRequest {
  // `type:id` of an org or a registered scope.
  string under = 1;
  // The `next_after` of the page before. Empty: from the start.
  string after = 2;
  // At most 1000. 0: 100.
  uint32 limit = 3;
}

message PutScopeRequest {
  PathEntry scope = 1;
  // An org of the tenant or a registered scope.
  PathEntry parent = 2;
  // Not set: what the scope's type starts as.
  optional bool private = 3;
}

message MoveScopeRequest {
  PathEntry scope = 1;
  PathEntry parent = 2;
  // Who agreed to a move into a looser scope. A service only.
  repeated string approved_by = 3;
}

message ScopeRequest {
  PathEntry scope = 1;
}

message SetPrivateRequest {
  PathEntry scope = 1;
  bool private = 2;
}

message ListAssignmentsRequest {
  // Not set: every scope.
  PathEntry scope = 1;
  // A principal or `group:<key>`. Empty: every subject.
  string subject = 2;
  string after = 3;
  uint32 limit = 4;
}

message AssignRequest {
  // A principal or `group:<key>`.
  string subject = 1;
  string role = 2;
  PathEntry scope = 3;
  // RFC 3339. Empty: it does not end.
  string expires_at = 4;
}

message SetAssignmentExpiryRequest {
  // `ra_<uuidv7>`.
  string id = 1;
  // RFC 3339. Not set: it does not end.
  optional string expires_at = 2;
}

message AssignmentRequest {
  string id = 1;
}

message ListGroupsRequest {
  // Empty: every org.
  string org = 1;
  string after = 2;
  uint32 limit = 3;
}

message CreateGroupRequest {
  string org = 1;
  string key = 2;
  string name = 3;
}

message GroupRequest {
  string key = 1;
}

message ListGroupMembersRequest {
  string key = 1;
  string after = 2;
  uint32 limit = 3;
}

message GroupMemberRequest {
  string key = 1;
  // A principal or `group:<key>`.
  string member = 2;
}

message ListRolesRequest {
  // `type:id` of the org or registered scope the caller manages. Empty: the
  // whole tenant.
  string scope = 1;
}

// ---------- Apps (CONTRACTS.md 7.13.8) ----------

message CreateAppRequest {
  string name = 1;
}

message ListAppsRequest {}

message RotateAppSecretRequest {
  // The client id, `app_<uuidv7>`.
  string id = 1;
  // Not set: 3600. At most 604800.
  optional uint64 overlap_secs = 2;
}

message AppRequest {
  string id = 1;
}
