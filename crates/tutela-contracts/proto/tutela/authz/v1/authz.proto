// The remote check API over gRPC (CONTRACTS.md 7.6). The messages carry the
// same fields, with the same names and meanings, as the JSON of section 7.
// This file grows only by adding fields and services (CONTRACTS.md 10).
syntax = "proto3";

package tutela.authz.v1;

service Authz {
  // POST /access/v1/evaluation.
  rpc Evaluate(EvaluationRequest) returns (Evaluation);
  // POST /access/v1/evaluations.
  rpc Evaluations(EvaluationsRequest) returns (EvaluationsResponse);
  // POST /access/v1/search/resource.
  rpc SearchResource(SearchRequest) returns (SearchResourceResponse);
  // POST /access/v1/search/subject.
  rpc SearchSubject(SearchRequest) returns (SearchSubjectResponse);
  // POST /v1/authz/permissions.
  rpc Permissions(PermissionsRequest) returns (PermissionsResponse);
  // POST /v1/authz/write-check.
  rpc WriteCheck(WriteCheckRequest) returns (WriteCheckResponse);
  // POST /v1/authz/explain.
  rpc Explain(EvaluationRequest) returns (ExplainResponse);
  // POST /v1/authz/simulate.
  rpc Simulate(SimulateRequest) returns (SimulateResponse);
}

// One link of the `act` chain: subject.properties.act in JSON.
message Actor {
  string sub = 1;
  Actor act = 2;
}

message Subject {
  string type = 1;
  string id = 2;
  // subject.properties.act in JSON.
  Actor act = 3;
}

message Action {
  string name = 1;
}

message PathEntry {
  string type = 1;
  string id = 2;
}

message StringList {
  repeated string values = 1;
}

// A field value that conditions read. `null_value` is the JSON null.
message AttrValue {
  oneof value {
    bool null_value = 1;
    string string_value = 2;
    int64 integer_value = 3;
    bool boolean_value = 4;
    StringList strings_value = 5;
  }
}

message Resource {
  string type = 1;
  string id = 2;
  // resource.properties.path in JSON.
  repeated PathEntry path = 3;
  // resource.properties.attrs in JSON.
  map<string, AttrValue> attrs = 4;
}

// `fields` is a message so that "no list" and "an empty list" differ.
message Context {
  StringList fields = 1;
  optional uint64 at_least_revision = 2;
}

message EvaluationRequest {
  Subject subject = 1;
  Action action = 2;
  Resource resource = 3;
  Context context = 4;
}

message FieldMask {
  repeated string read = 1;
  repeated string write = 2;
}

// CONTRACTS.md 6.3. Only the fields of its `kind` are set.
message Obligation {
  string kind = 1;
  string value = 2;
  string on_behalf_of = 3;
  bool reason_required = 4;
  repeated string fields = 5;
}

// The Decision object (CONTRACTS.md 6.1).
message Decision {
  string effect = 1;
  string level = 2;
  FieldMask field_mask = 3;
  repeated string rule_ids = 4;
  string reason = 5;
  uint64 rev = 6;
  repeated Obligation obligations = 7;
}

// One item of a batch that could not be evaluated.
message ItemError {
  uint32 status = 1;
  string message = 2;
}

message EvaluationContext {
  Decision tutela = 1;
  ItemError error = 2;
}

message Evaluation {
  bool decision = 1;
  EvaluationContext context = 2;
}

message EvaluationsOptions {
  string evaluations_semantic = 1;
}

message EvaluationsRequest {
  Subject subject = 1;
  Action action = 2;
  Resource resource = 3;
  Context context = 4;
  repeated EvaluationRequest evaluations = 5;
  EvaluationsOptions options = 6;
}

message EvaluationsResponse {
  repeated Evaluation evaluations = 1;
}

message PageRequest {
  string token = 1;
  // 0 means the default page size.
  uint32 limit = 2;
}

message PageResponse {
  // Empty on the last page.
  string next_token = 1;
  uint32 count = 2;
}

// A resource search names `subject.id` and leaves `resource.id` empty.
// A subject search does the opposite.
message SearchRequest {
  Subject subject = 1;
  Action action = 2;
  Resource resource = 3;
  Context context = 4;
  PageRequest page = 5;
}

message SearchResourceResponse {
  repeated PathEntry results = 1;
  PageResponse page = 2;
  // context.tutela.filter in JSON: the CONTRACTS.md 6.6 filter, as JSON text,
  // because its condition is a tree of open shape.
  string filter_json = 3;
  uint64 rev = 4;
}

message SearchSubjectResponse {
  repeated Subject results = 1;
  PageResponse page = 2;
  uint64 rev = 3;
}

message PathEntries {
  repeated PathEntry entries = 1;
}

message WriteCheckRequest {
  Subject subject = 1;
  Resource resource = 2;
  map<string, AttrValue> new_attrs = 3;
  // Set for a move.
  optional PathEntries new_path = 4;
  repeated Resource new_links = 5;
  repeated string approved_by = 6;
  Context context = 7;
}

message WriteCheckResponse {
  bool decision = 1;
  uint64 rev = 2;
  // context.tutela of the JSON answer, as JSON text.
  string decision_json = 3;
}

message ExplainResponse {
  bool decision = 1;
  // context.tutela of the JSON answer, as JSON text.
  string explanation_json = 2;
}

message SimulateRequest {
  EvaluationRequest evaluation = 1;
  // `candidate` of the JSON body, as JSON text. Empty: no candidate.
  string candidate_json = 2;
}

message SimulateResponse {
  bool decision = 1;
  bool changed = 2;
  // The whole JSON answer, as JSON text.
  string result_json = 3;
}

message PermissionsRequest {
  Subject subject = 1;
  Resource resource = 2;
  // Missing: every UI key of the model.
  StringList ui_keys = 3;
  repeated string actions = 4;
  repeated string fields = 5;
  optional uint64 at_least_revision = 6;
  // The If-None-Match header.
  string if_none_match = 7;
}

message UiAnswer {
  string mode = 1;
  string reason = 2;
}

message PermissionsResponse {
  uint64 rev = 1;
  map<string, UiAnswer> ui = 2;
  map<string, bool> actions = 3;
  map<string, string> fields = 4;
  // The ETag header: the same tag as over HTTP.
  string etag = 5;
  // true is the 304 of HTTP: only `etag` is set.
  bool not_modified = 6;
}
